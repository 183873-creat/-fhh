<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجري | تسوق أونلاين - الدفع عند الاستلام</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#6b7280;--pri:#0f766e;--pri2:#0d5f59;--acc:#f59e0b;--bd:#e5e7eb;--red:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#eef1f5;--mut:#9aa3af;--bd:#2a303a;--pri:#14b8a6;--pri2:#0f9488}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{font-weight:800;font-size:1.3rem;color:var(--pri)}.sp{flex:1}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--pri2)}.btn.o{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.badge{background:var(--acc);color:#000;border-radius:99px;font-size:.75rem;padding:1px 7px;margin-inline-start:6px}
.hero{background:linear-gradient(135deg,var(--pri),#0b3b46);color:#fff;padding:44px 20px;text-align:center}
.hero h1{margin:0 0 8px;font-size:clamp(1.6rem,5vw,2.6rem)}.hero p{margin:0;opacity:.9}
.trust{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.trust span{background:rgba(255,255,255,.15);border-radius:99px;padding:6px 14px;font-size:.9rem}
.wrap{max-width:1150px;margin:0 auto;padding:18px 16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.bar input,.bar select{flex:1;min-width:150px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pi{aspect-ratio:1;background:linear-gradient(135deg,#99f6e4,#fde68a);display:flex;align-items:center;justify-content:center;font-size:3rem}
.pi img{width:100%;height:100%;object-fit:cover}
.pb{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}.pb h3{margin:0;font-size:1rem}
.pb .ds{color:var(--mut);font-size:.85rem;flex:1}.pr{font-weight:800;color:var(--pri);font-size:1.1rem}
.pr s{color:var(--mut);font-weight:400;font-size:.85rem;margin-inline-start:6px}
.empty{text-align:center;color:var(--mut);padding:40px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none}
.ov.on{display:flex}.sheet{background:var(--card);width:min(440px,100%);height:100%;overflow:auto;padding:16px}
.row{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--bd);padding:10px 0}
.th{width:54px;height:54px;border-radius:8px;overflow:hidden;background:#99f6e4;display:flex;align-items:center;justify-content:center;flex:none}
.th img{width:100%;height:100%;object-fit:cover}.row .i{flex:1}
.q button{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);cursor:pointer}
label{display:block;margin:10px 0 4px;font-size:.9rem;color:var(--mut)}
.f input,.f select,.f textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.tot{display:flex;justify-content:space-between;padding:4px 0}.tot.g{font-weight:800;font-size:1.15rem;border-top:2px solid var(--bd);margin-top:6px;padding-top:10px}
.cod{background:#ecfdf5;color:#065f46;border-radius:10px;padding:10px;margin:12px 0;font-size:.9rem}
footer{text-align:center;color:var(--mut);padding:24px;font-size:.85rem}
</style>
</head>
<body>
<div id="app"><div class="empty">جارٍ التحميل…</div></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,addDoc,getDoc,getDocs,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";

const db=getFirestore(initializeApp(firebaseConfig));
const W=["01 أدرار","02 الشلف","03 الأغواط","04 أم البواقي","05 باتنة","06 بجاية","07 بسكرة","08 بشار","09 البليدة","10 البويرة","11 تمنراست","12 تبسة","13 تلمسان","14 تيارت","15 تيزي وزو","16 الجزائر","17 الجلفة","18 جيجل","19 سطيف","20 سعيدة","21 سكيكدة","22 سيدي بلعباس","23 عنابة","24 قالمة","25 قسنطينة","26 المدية","27 مستغانم","28 المسيلة","29 معسكر","30 ورقلة","31 وهران","32 البيض","33 إليزي","34 برج بوعريريج","35 بومرداس","36 الطارف","37 تندوف","38 تيسمسيلت","39 الوادي","40 خنشلة","41 سوق أهراس","42 تيبازة","43 ميلة","44 عين الدفلى","45 النعامة","46 عين تموشنت","47 غرداية","48 غليزان","49 تيميمون","50 برج باجي مختار","51 أولاد جلال","52 بني عباس","53 عين صالح","54 عين قزام","55 توقرت","56 جانت","57 المغير","58 المنيعة"];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US').replace(/,/g,' ')+' دج';
let S={name:'متجري',whatsapp:'',feeHome:600,feeDesk:400},P=[],cart={},q='',cat='';
const prod=id=>P.find(p=>p.id===id),img=p=>p.img?`<img src="${p.img}" alt="${esc(p.name)}">`:'🛍️';

async function load(){
  try{
    const s=await getDoc(doc(db,'settings','main'));if(s.exists())S={...S,...s.data()};
    const r=await getDocs(query(collection(db,'products'),orderBy('createdAt','desc')));
    P=r.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){console.error(e)}
  render();
}
function render(){
  document.title=S.name+' | تسوق أونلاين - الدفع عند الاستلام';
  const cats=[...new Set(P.map(p=>p.cat).filter(Boolean))];
  const list=P.filter(p=>(!cat||p.cat===cat)&&(!q||(p.name+(p.desc||'')).includes(q)));
  const n=Object.values(cart).reduce((a,b)=>a+b,0);
  $('#app').innerHTML=`<header><span class="logo">${esc(S.name)}</span><span class="sp"></span><button class="btn" id="cb">🛒 السلة<span class="badge">${n}</span></button></header>
  <section class="hero"><h1>تسوّق بثقة… وادفع عند الاستلام</h1><p>توصيل لـ 58 ولاية • لا حاجة للدفع المسبق</p>
  <div class="trust"><span>💵 الدفع عند الاستلام</span><span>🚚 توصيل لكل الولايات</span><span>✅ تفحّص طلبك قبل الدفع</span></div></section>
  <main class="wrap"><div class="bar"><input id="q" placeholder="ابحث عن منتج…" value="${esc(q)}"><select id="cat"><option value="">كل الأصناف</option>${cats.map(c=>`<option ${c===cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
  ${list.length?`<div class="grid">${list.map(p=>`<div class="pc"><div class="pi">${img(p)}</div><div class="pb"><h3>${esc(p.name)}</h3><div class="ds">${esc(p.desc)}</div><div class="pr">${fmt(p.price)}${p.old>p.price?`<s>${fmt(p.old)}</s>`:''}</div><button class="btn" data-add="${p.id}">أضف إلى السلة</button></div></div>`).join('')}</div>`:'<div class="empty">لا توجد منتجات حاليًا</div>'}</main>
  <footer>© ${esc(S.name)} — الدفع عند الاستلام فقط</footer>`;
  $('#cb').onclick=openCart;
  $('#q').oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const i=$('#q');i.focus();i.setSelectionRange(p,p)};
  $('#cat').onchange=e=>{cat=e.target.value;render()};
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{cart[b.dataset.add]=(cart[b.dataset.add]||0)+1;render()});
}
const sub=()=>Object.entries(cart).reduce((a,[id,n])=>a+(prod(id)?.price||0)*n,0);
const closeSheet=()=>$('#ov').classList.remove('on');

function openCart(){
  const ids=Object.keys(cart).filter(prod),s=$('#sheet');$('#ov').classList.add('on');
  if(!ids.length){s.innerHTML='<button class="btn o" id="x">إغلاق</button><div class="empty">سلتك فارغة</div>';$('#x').onclick=closeSheet;return}
  s.innerHTML=`<button class="btn o" id="x">✕ إغلاق</button><h2>سلة المشتريات</h2>
  ${ids.map(id=>{const p=prod(id);return `<div class="row"><div class="th">${img(p)}</div><div class="i"><b>${esc(p.name)}</b><div>${fmt(p.price)}</div></div><div class="q"><button data-m="${id}">−</button> ${cart[id]} <button data-p="${id}">+</button></div></div>`}).join('')}
  <div class="f"><label>الاسم الكامل</label><input id="fn"><label>رقم الهاتف</label><input id="fp" inputmode="tel" placeholder="05 / 06 / 07 xx xx xx xx"><label>الولاية</label><select id="fw"><option value="">اختر الولاية</option>${W.map(w=>`<option>${w}</option>`).join('')}</select><label>البلدية / العنوان</label><textarea id="fa" rows="2"></textarea><label>نوع التوصيل</label><select id="fd"><option value="home">إلى المنزل (${fmt(S.feeHome)})</option><option value="desk">إلى مكتب شركة التوصيل (${fmt(S.feeDesk)})</option></select></div>
  <div class="cod">💵 الدفع عند الاستلام: لا تدفع شيئًا الآن، تدفع للموزّع عند استلام طلبك.</div>
  <div id="tt"></div><button class="btn" style="width:100%;margin-top:10px" id="ok">تأكيد الطلب</button><div id="res"></div>`;
  const upd=()=>{const fee=$('#fd').value==='home'?S.feeHome:S.feeDesk,t=sub();$('#tt').innerHTML=`<div class="tot"><span>المنتجات</span><span>${fmt(t)}</span></div><div class="tot"><span>التوصيل</span><span>${fmt(fee)}</span></div><div class="tot g"><span>الإجمالي عند الاستلام</span><span>${fmt(t+fee)}</span></div>`};
  upd();$('#fd').onchange=upd;$('#x').onclick=closeSheet;
  s.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=b.dataset.m;if(--cart[i]<=0)delete cart[i];render();openCart()});
  s.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{cart[b.dataset.p]++;render();openCart()});
  $('#ok').onclick=submit;
}
async function submit(){
  const name=$('#fn').value.trim(),phone=$('#fp').value.replace(/[\s.-]/g,''),wilaya=$('#fw').value,address=$('#fa').value.trim(),delivery=$('#fd').value;
  if(!name||!wilaya||!address)return alert('المرجو ملء الاسم والولاية والعنوان');
  if(!/^(0|\+?213)[567]\d{8}$/.test(phone))return alert('رقم الهاتف غير صحيح (مثال: 0555123456)');
  const fee=delivery==='home'?S.feeHome:S.feeDesk,subtotal=sub(),total=subtotal+fee;
  const items=Object.keys(cart).filter(prod).map(id=>({id,name:prod(id).name,price:prod(id).price,qty:cart[id]}));
  const btn=$('#ok');btn.disabled=true;btn.textContent='جارٍ الإرسال…';
  try{
    await addDoc(collection(db,'orders'),{name,phone,wilaya,address,delivery,items,subtotal,fee,total,status:'جديد',createdAt:serverTimestamp()});
  }catch(e){btn.disabled=false;btn.textContent='تأكيد الطلب';return alert('تعذر إرسال الطلب، حاول مجددًا')}
  const msg=`🛒 طلب جديد (الدفع عند الاستلام)\n${items.map(i=>`• ${i.name} × ${i.qty}`).join('\n')}\n\nالاسم: ${name}\nالهاتف: ${phone}\nالولاية: ${wilaya}\nالعنوان: ${address}\nالإجمالي: ${fmt(total)}`;
  const num=(S.whatsapp||'').replace(/\D/g,'');
  cart={};render();
  $('#sheet').innerHTML=`<button class="btn o" id="x">إغلاق</button><div class="cod" style="margin-top:16px;font-size:1.05rem">✅ تم استلام طلبك بنجاح! سنتصل بك قريبًا لتأكيده. الدفع عند الاستلام.</div>${num?`<a href="https://wa.me/${num}?text=${encodeURIComponent(msg)}" target="_blank"><button class="btn" style="width:100%">أرسل نسخة عبر واتساب (اختياري)</button></a>`:''}`;
  $('#x').onclick=closeSheet;
}
load();
</script>
</body>
</html>
